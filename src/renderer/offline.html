<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>MemCore — 连接失败</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container { max-width: 400px; padding: 40px; }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 24px; }
    .btn-row { display: flex; gap: 12px; justify-content: center; }
    button {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔌</div>
    <h1>无法连接到 MemCore 服务</h1>
    <p>Dashboard 加载失败，请检查网络连接或服务是否在线。<br/>如需修改服务地址，请打开设置。</p>
    <div class="btn-row">
      <button class="btn-secondary" onclick="window.memcore.app.openSettings()">打开设置</button>
      <button class="btn-primary" onclick="window.location.reload()">重试</button>
    </div>
  </div>
</body>
</html>
