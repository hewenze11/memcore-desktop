<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemCore 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
      padding: 24px;
      font-size: 14px;
    }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #1a1a2e; }
    h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
    .section {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 4px; font-weight: 500; }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: #f9fafb;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #6366f1; background: white; }
    .hint { font-size: 11px; color: #9ca3af; margin-top: 3px; }
    .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>
  <h2>⚙️ MemCore 设置</h2>

  <div class="section">
    <h3>服务地址</h3>
    <div class="field">
      <label>API Base URL</label>
      <input type="text" id="apiBaseUrl" placeholder="http://172.236.254.239:31010" />
      <div class="hint">memcore-api 地址，修改后刷新生效</div>
    </div>
  </div>

  <div class="section">
    <h3>算力层配置（Keychain 加密存储）</h3>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="llmApiKey" placeholder="sk-..." autocomplete="off" />
      <div class="hint">算力模型密钥，不明文存盘</div>
    </div>
    <div class="field">
      <label>Base URL</label>
      <input type="text" id="llmBaseUrl" placeholder="https://api.openai.com/v1" />
    </div>
    <div class="field">
      <label>模型名称</label>
      <input type="text" id="llmModel" placeholder="gpt-4o" />
    </div>
    <div class="field">
      <label>视觉模型名称</label>
      <input type="text" id="llmVisionModel" placeholder="gpt-4o（留空则与模型相同）" />
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-secondary" id="cancelBtn">取消</button>
    <button class="btn-primary" id="saveBtn">保存</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const api = window.memcore

    function showToast(msg, isError) {
      const t = document.getElementById('toast')
      t.textContent = msg
      t.className = 'toast show' + (isError ? ' error' : '')
      setTimeout(() => { t.className = 'toast' }, 2500)
    }

    // 加载现有配置
    api.config.load().then(cfg => {
      document.getElementById('apiBaseUrl').value = cfg.apiBaseUrl || ''
      document.getElementById('llmApiKey').value = cfg.llmApiKey || ''
      document.getElementById('llmBaseUrl').value = cfg.llmBaseUrl || ''
      document.getElementById('llmModel').value = cfg.llmModel || ''
      document.getElementById('llmVisionModel').value = cfg.llmVisionModel || ''
    })

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const patch = {
        apiBaseUrl: document.getElementById('apiBaseUrl').value.trim() || 'http://172.236.254.239:31010',
        llmApiKey: document.getElementById('llmApiKey').value.trim() || null,
        llmBaseUrl: document.getElementById('llmBaseUrl').value.trim() || null,
        llmModel: document.getElementById('llmModel').value.trim() || null,
        llmVisionModel: document.getElementById('llmVisionModel').value.trim() || null,
      }
      try {
        await api.config.save(patch)
        await api.app.reloadDashboard()
        showToast('✅ 已保存')
      } catch (e) {
        showToast('保存失败：' + e.message, true)
      }
    })

    document.getElementById('cancelBtn').addEventListener('click', () => {
      window.close()
    })
  </script>
</body>
</html>
