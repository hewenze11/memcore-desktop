name: Build MemCore Desktop

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: write  # 允许创建 GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      FEISHU_WEBHOOK: https://open.feishu.cn/open-apis/bot/v2/hook/f5863f4d-4f8f-41e6-8361-ee3a16672099

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        shell: bash
        run: |
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=dev

      - name: TypeScript build
        run: npm run build

      # dev 分支：打包 win-unpacked（绿色版）+ NSIS 草稿安装包，均上传为 Artifact
      # win-unpacked：免安装直接运行，供快速验证
      # NSIS draft：安装包草稿，不发布 Release，供内部测试
      - name: Electron Builder (dev - win-unpacked)
        if: github.ref == 'refs/heads/dev'
        run: npx electron-builder --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Electron Builder (dev - NSIS draft)
        if: github.ref == 'refs/heads/dev'
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dev artifact (win-unpacked)
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: memcore-desktop-${{ env.SHORT_SHA }}-win-unpacked
          path: release/win-unpacked/
          retention-days: 7

      - name: Upload dev artifact (NSIS draft)
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: memcore-desktop-${{ env.SHORT_SHA }}-nsis-draft
          path: release/*.exe
          retention-days: 7

      # main 分支：打包安装包 + 发布 GitHub Release
      - name: Electron Builder (main - installer)
        if: github.ref == 'refs/heads/main'
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SHA256
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_ENV
          echo "EXE_SHA256=$hash" >> $env:GITHUB_ENV
          "$hash  $($exe.Name)" | Out-File -FilePath release/SHA256SUMS.txt -Encoding utf8

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}
          name: "MemCore Desktop v${{ env.APP_VERSION }}"
          body: |
            ## MemCore Desktop v${{ env.APP_VERSION }}

            **构建信息**
            - Commit: `${{ env.SHORT_SHA }}`
            - 平台: Windows x64

            **SHA256 校验**
            ```
            ${{ env.EXE_SHA256 }}  ${{ env.EXE_NAME }}
            ```
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 上传安装包到测试服务器（dev + main 都上传，供官网下载）
      # dev  → /var/www/downloads/dev/MemCore-Setup.exe
      # main → /var/www/downloads/MemCore-Setup.exe（官网正式下载地址）
      - name: Upload installer to server (dev)
        if: github.ref == 'refs/heads/dev'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 172.236.254.239 >> ~/.ssh/known_hosts 2>/dev/null
          EXE=$(ls release/*.exe | head -1)
          ssh -i ~/.ssh/id_rsa -p 22 root@172.236.254.239 "mkdir -p /var/www/downloads/dev"
          scp -i ~/.ssh/id_rsa -P 22 "$EXE" root@172.236.254.239:/var/www/downloads/dev/MemCore-Setup.exe

      - name: Upload installer to server (main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 172.236.254.239 >> ~/.ssh/known_hosts 2>/dev/null
          EXE=$(ls release/*.exe | head -1)
          ssh -i ~/.ssh/id_rsa -p 22 root@172.236.254.239 "mkdir -p /var/www/downloads"
          scp -i ~/.ssh/id_rsa -P 22 "$EXE" root@172.236.254.239:/var/www/downloads/MemCore-Setup.exe

      # 飞书通知（使用 Python 构造 JSON，避免 bash 字符串乱码和换行问题）
      - name: Notify Feishu on success
        if: success()
        shell: python
        run: |
          import os, json, urllib.request
          webhook = os.environ['FEISHU_WEBHOOK']
          branch  = os.environ.get('BRANCH_NAME', '')
          sha     = os.environ.get('SHORT_SHA', '')
          ver     = os.environ.get('APP_VERSION', '')
          chk     = os.environ.get('EXE_SHA256', '')

          if branch == 'main':
              lines = [
                  [{"tag":"text","text":f"[MemCore Desktop] v{ver} 发布成功 ✅"}],
                  [{"tag":"text","text":f"commit: {sha}"}],
                  [{"tag":"text","text":f"SHA256: {chk}"}],
              ]
          else:
              lines = [
                  [{"tag":"text","text":f"[MemCore Desktop] dev 构建成功 ✅"}],
                  [{"tag":"text","text":f"branch: {branch}  commit: {sha}"}],
              ]

          payload = {"msg_type":"post","content":{"post":{"zh_cn":{"title":"CI 通知","content":lines}}}}
          req = urllib.request.Request(webhook, data=json.dumps(payload).encode(), headers={"Content-Type":"application/json"})
          urllib.request.urlopen(req, timeout=10)

      - name: Notify Feishu on failure
        if: failure()
        shell: python
        run: |
          import os, json, urllib.request
          webhook = os.environ['FEISHU_WEBHOOK']
          branch  = os.environ.get('BRANCH_NAME', '')
          sha     = os.environ.get('SHORT_SHA', '')

          lines = [
              [{"tag":"text","text":f"[MemCore Desktop] 构建失败 ❌"}],
              [{"tag":"text","text":f"branch: {branch}  commit: {sha}"}],
          ]
          payload = {"msg_type":"post","content":{"post":{"zh_cn":{"title":"CI 通知","content":lines}}}}
          req = urllib.request.Request(webhook, data=json.dumps(payload).encode(), headers={"Content-Type":"application/json"})
          urllib.request.urlopen(req, timeout=10)
