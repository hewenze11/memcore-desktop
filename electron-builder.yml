appId: ai.cayan.memcore
productName: MemCore
copyright: Copyright © 2026 Cayan

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - src/renderer/**/*
  - node_modules/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  # icon: build/icon.ico  # TODO: 放置品牌图标后取消注释

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE

mac:
  target:
    - dmg
  category: public.app-category.productivity
  # icon: build/icon.icns  # TODO

linux:
  target:
    - AppImage
  # icon: build/icon.png  # TODO

publish:
  provider: github
  owner: hewenze11
  repo: memcore-desktop
